<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Voetbal 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b1620;--ink:#f4f7f2;--mute:#9db8c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;padding:12px}
canvas{width:100%;max-width:900px;aspect-ratio:900/520;border-radius:10px;display:block}
#cfg{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:900px}
#cfg label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
#cfg input{font:inherit;font-size:14px;color:var(--ink);background:#14263a;border:1px solid #2b4560;border-radius:6px;padding:6px 8px;width:120px}
#cfg input[type=color]{padding:2px;height:34px;width:60px}
#cfg select{font:inherit;font-size:14px;color:var(--ink);background:#14263a;border:1px solid #2b4560;border-radius:6px;padding:7px 8px}
p{margin:0;color:var(--mute);font-size:14px;text-align:center;max-width:900px;line-height:1.5}
</style></head><body>
<canvas id="c" width="900" height="520"></canvas>
<div id="cfg">
<label>Teamnaam<input id="tn" value="Mijn Team" maxlength="14"></label>
<label>Shirtkleur<input id="tc" type="color" value="#2f6bff"></label>
<label>Keeper<input id="n0" value="Keeper" maxlength="10"></label>
<label>Speler 1<input id="n1" value="Jij" maxlength="10"></label>
<label>Speler 2<input id="n2" value="Maatje" maxlength="10"></label>
<label>Echte speeltijd (90 spelminuten)<select id="dur"><option value="180">3 min</option><option value="360" selected>6 min</option><option value="600">10 min</option></select></label>
<label>Spelvorm<select id="mode"><option value="match">Wedstrijd</option><option value="pen">Penalty’s</option></select></label>
</div>
<p>Bewegen: WASD of pijltjes (omhoog = van je af) &middot; Schieten: spatie (ingedrukt houden = harder) &middot; Passen: E &middot; Afpakken: Q &middot; Sprinten: Shift &middot; Enter: opnieuw &middot; Esc: stoppen. Werkt het best op een computer.</p>
<button id="stop" tabindex="-1" onmousedown="event.preventDefault()" style="display:none;font:inherit;font-size:12px;color:#cfe;background:#14263a;border:1px solid #2b4560;border-radius:6px;padding:4px 12px;cursor:pointer">■ Stop</button>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const DPR=Math.min(3,Math.max(2,devicePixelRatio||1));cv.width=900*DPR;cv.height=520*DPR;g.setTransform(DPR,0,0,DPR,0,0);
const L=40,R=1640,T=30,B=690,CY=360,CX=840,GH=70,BR=4,PR=8;
const keys={};let P=[],ball,score=[0,0],time=360,state='menu',gt=0,charge=0,charging=false,active=null,last=0,tm=0,ex=0,cfg,camX=840,tot=360,stam=1,LBL=[],ARW=null,lastTouch=0,kcd=0,cur=null,face=[1,0];
const FONT="'Bricolage Grotesque',system-ui,sans-serif";
const $=id=>document.getElementById(id);
function readCfg(){cfg={tn:$('tn').value.trim()||'Mijn Team',c:$('tc').value,n:[$('n0').value||'Keeper',$('n1').value||'Speler 1',$('n2').value||'Speler 2','Speler 3','Speler 4','Speler 5']}}
const kd=e=>e.key.length>1?e.key:e.key.toLowerCase();
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=kd(e);if(k===' '||k.startsWith('Arrow'))e.preventDefault();if(keys[k])return;keys[k]=1;
 if(k==='Enter'&&(state==='menu'||state==='end'))start();
 if(k===' '&&state==='play'){charging=true;charge=0}
 if(k==='e'&&state==='play')pass();
 if(k==='q'&&state==='play')tackle();
 if(k==='p'&&state==='end'&&score[0]===score[1]&&!penUsed)startPen();
 if(k==='Escape'&&(state==='play'||state==='goal'||state==='pen'))stopGame()});
addEventListener('keyup',e=>{if(e.target.tagName==='INPUT')return;const k=kd(e);keys[k]=0;if(k===' ')release()});
cv.addEventListener('click',()=>{if(state==='menu'||state==='end')start()});
let mx=450,my=300,md=false,mon=false;
const cp=e=>{const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)/r.width*900;my=(e.clientY-r.top)/r.height*520;mon=true};
cv.addEventListener('pointermove',cp);
cv.addEventListener('pointerdown',e=>{cp(e);md=true});
addEventListener('pointerup',()=>{md=false});
function mk(team,role,hx,hy,i){return{team,role,x:hx,y:hy,hx,hy,vx:0,vy:0,cd:0,i}}
function reset(){
 P=[mk(0,'gk',L+25,CY,0),mk(1,'gk',R-25,CY,6)];[[400,-170],[400,170],[640,0],[860,-150],[860,150]].forEach((q,k)=>{P.push(mk(0,'f',q[0],CY+q[1],k+1));P.push(mk(1,'f',L+R-q[0],CY+q[1],k+7))});
 ball={x:CX,y:CY,vx:0,vy:0,z:0,vz:0};ao=null;own=null;charging=false;charge=0}
function start(){readCfg();document.activeElement&&document.activeElement.blur();score=[0,0];time=tot=+$('dur').value;reset();penUsed=false;if($('mode').value==='pen')startPen();else state='play'}
function inp(){const x=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),y=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0),m=Math.hypot(x,y);return m?[x/m,y/m]:[0,0]}
function kick(tx,ty,pw){const dx=tx-ball.x,dy=ty-ball.y,d=Math.hypot(dx,dy)||1;ball.vx=dx/d*pw;ball.vy=dy/d*pw;ball.vz=arguments[3]||0;lastTouch=cur?cur.team:0;kcd=.3}
function pass(){if(!active||Math.hypot(active.x-ball.x,active.y-ball.y)>PR+BR+9)return;const[ia,ib]=inp();let m=null,bs=-1e9;for(const q of P)if(q.team===0&&q.role==='f'&&q!==active){const dx=q.x-active.x,dy=q.y-active.y,dd=Math.hypot(dx,dy)||1,sc=((ia||ib)?(dx*ia+dy*ib)/dd:dx/dd)*300-dd*.5;if(sc>bs){bs=sc;m=q}}if(!m)return;cur=active;const d=Math.hypot(m.x-ball.x,m.y-ball.y);kick(m.x+m.vx*.4,m.y+m.vy*.4,Math.min(640,160+d*1.6))}
let own=null;
function hold(){
 if(own){const o=own;
  if(o!==active||kcd>0)own=null;
  else for(const q of P)if(q.team&&Math.hypot(q.x-o.x,q.y-o.y)<PR*2+20&&q.cd<=0){q.cd=.5;if(Math.random()<(Math.hypot(o.vx,o.vy)<30?.8:.55)){own=null;kcd=.5;const dx=ball.x-q.x,dy=ball.y-q.y,d=Math.hypot(dx,dy)||1;ball.vx=dx/d*140;ball.vy=dy/d*140;lastTouch=1;break}}}
 else if(active&&kcd<=0&&Math.hypot(active.x-ball.x,active.y-ball.y)<PR+BR+12&&!P.some(q=>q.team&&Math.hypot(q.x-ball.x,q.y-ball.y)<Math.hypot(active.x-ball.x,active.y-ball.y)))own=active;
 if(own){ball.x=own.x+face[0]*(PR+BR+1);ball.y=own.y+face[1]*(PR+BR+1);ball.vx=own.vx;ball.vy=own.vy;ball.z=0;ball.vz=0;lastTouch=0}}
let ao=null,tcd=0;
function holdAI(){
 if(ao&&(kcd>0||own))ao=null;
 if(!ao&&!own&&kcd<=0){for(const q of P)if(q.team===1&&q.role==='f'&&Math.hypot(q.x-ball.x,q.y-ball.y)<PR+BR+16&&!P.some(r=>r.team===0&&Math.hypot(r.x-ball.x,r.y-ball.y)<Math.hypot(q.x-ball.x,q.y-ball.y))){ao=q;break}}
 if(ao){const v=Math.hypot(ao.vx,ao.vy),fx=v>15?ao.vx/v:-1,fy=v>15?ao.vy/v:0;ball.x=ao.x+fx*(PR+BR+1);ball.y=ao.y+fy*(PR+BR+1);ball.vx=ao.vx;ball.vy=ao.vy;ball.z=0;ball.vz=0;lastTouch=1}}
function tackle(){
 if(!active||tcd>0)return;tcd=.8;
 if(ao&&Math.hypot(active.x-ao.x,active.y-ao.y)<PR*2+12&&Math.random()<.7){ao=null;kcd=.25;const dx=active.x-ball.x,dy=active.y-ball.y,d=Math.hypot(dx,dy)||1;ball.vx=dx/d*90;ball.vy=dy/d*90;lastTouch=0}}
function release(){
 if(!charging)return;charging=false;
 if(active&&state==='play'&&Math.hypot(active.x-ball.x,active.y-ball.y)<PR+BR+9){
  cur=active;let[a,b]=inp();if(!a&&!b){a=1;b=(CY-ball.y)/300}
  kick(ball.x+a*100,ball.y+b*100,300+450*charge,charge>.55?(charge-.4)*330:30)}
 charge=0}
function go(p,tx,ty,s){const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);if(d<3)return[0,0];const k=Math.min(s,d*5)/d;return[dx*k,dy*k]}
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function upd(dt){
 const near=[null,null];
 for(const t of[0,1]){let b=1e9;for(const p of P)if(p.team===t&&p.role==='f'){const d=Math.hypot(p.x-ball.x,p.y-ball.y);if(d<b){b=d;near[t]=p}}}
 active=near[0];const loose=!own&&!ao,sec=[null,null];for(const t of[0,1]){let b=1e9;for(const q of P)if(q.team===t&&q.role==='f'&&q!==near[t]){const d=Math.hypot(q.x-ball.x,q.y-ball.y);if(d<b){b=d;sec[t]=q}}}
 let b3=1e9,th=null;for(const q of P)if(q.team===1&&q.role==='f'&&q!==near[1]&&q!==sec[1]){const d=Math.hypot(q.x-ball.x,q.y-ball.y);if(d<b3){b3=d;th=q}}
 if(charging)charge=Math.min(1,charge+dt/0.7);
 for(const p of P){
  p.cd-=dt;cur=p;const dir=p.team?-1:1,gx=p.team?L:R,sp=p.team?104:96;let dv=[0,0];
  if(p===active){const[a,b]=inp();if(a||b)face=[a,b];const sr=keys.Shift&&stam>.02&&(a||b),v=sr?128:98;stam=cl(stam+(sr?-.28:.12)*dt,0,1);dv=[a*v,b*v*2]}
  else if(p.role==='gk'){
   dv=go(p,p.hx,cl(ball.y,CY-GH+8,CY+GH-8),70);
   if(p.cd<=0&&Math.hypot(p.x-ball.x,p.y-ball.y)<PR+BR+9){kick(CX,T+60+Math.random()*(B-T-120),440);p.cd=0.7}}
  else if(p===near[p.team]){
   const d=Math.hypot(p.x-ball.x,p.y-ball.y);
   if(d>26)dv=go(p,loose?ball.x:ball.x-dir*11,ball.y,sp*(own&&p.team?1.25:1));
   else{dv=(own&&p.team)?go(p,ball.x,ball.y,sp*1.25):loose?go(p,ball.x,ball.y,sp):go(p,gx,CY+(p.hy-CY)*0.3,sp*0.9);
    if(p.cd<=0&&Math.abs(p.x-gx)<360){kick(gx,CY+(Math.random()-.5)*180,560,40+Math.random()*60);p.cd=0.9}}}
  else{const mine=lastTouch===p.team,pr=(!mine||loose)&&(p===sec[p.team]||p===th)&&Math.hypot(p.x-ball.x,p.y-ball.y)<260,tx=pr?ball.x:cl(p.hx+(ball.x-CX)*(p.team?.8:.5)+(mine?dir*(p.team?260:160)*Math.abs(p.hx-(p.team?R:L))/800:0),L+40,R-40),ty=pr?ball.y:cl(p.hy+(ball.y-CY)*.35,T+PR,B-PR);dv=go(p,tx,ty,sp)}
  const s=Math.min(1,dt*9);p.vx+=(dv[0]-p.vx)*s;p.vy+=(dv[1]-p.vy)*s;
  p.x=cl(p.x+p.vx*dt,L+PR,R-PR);p.y=cl(p.y+p.vy*dt,T+PR,B-PR)}
 for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
  const a=P[i],b=P[j],dx=b.x-a.x,dy=(b.y-a.y)*.6,d=Math.hypot(dx,dy);
  if(d>0&&d<PR*3.2){const o=(PR*3.2-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*o;a.y-=ny*o/.6;b.x+=nx*o;b.y+=ny*o/.6}}
 for(const p of P){
  const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy),m=PR+BR;
  if(d<m&&d>0&&ball.z<14){const nx=dx/d,ny=dy/d;ball.x=p.x+nx*m;ball.y=p.y+ny*m;
   const rv=(ball.vx-p.vx)*nx+(ball.vy-p.vy)*ny;
   if(rv<0){ball.vx-=1.3*rv*nx;ball.vy-=1.3*rv*ny}
   ball.vx+=p.vx*0.15;ball.vy+=p.vy*0.15}}
 moveBall(dt);
 kcd-=dt;tcd-=dt;hold();holdAI();
 if(0){const d=0;
  if(d<34&&!P.some(q=>q.team&&Math.hypot(q.x-ball.x,q.y-ball.y)<PR+BR+4)){
   const tx=active.x+face[0]*(PR+BR+2),ty=active.y+face[1]*(PR+BR+2),k=Math.min(1,dt*14);
   ball.x+=(tx-ball.x)*k;ball.y+=(ty-ball.y)*k;ball.vx=active.vx;ball.vy=active.vy}}
 time-=dt;if(time<=0){time=0;state='end'}}
function moveBall(dt){
 ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const f=Math.pow(0.3,dt);ball.vx*=f;ball.vy*=f;
 ball.z+=ball.vz*dt;ball.vz-=520*dt;if(ball.z<0){ball.z=0;ball.vz=Math.abs(ball.vz)*.45;if(ball.vz<30)ball.vz=0}
 if(ball.y<T+BR){ball.y=T+BR;ball.vy=Math.abs(ball.vy)*.8}
 if(ball.y>B-BR){ball.y=B-BR;ball.vy=-Math.abs(ball.vy)*.8}
 const ing=Math.abs(ball.y-CY)<GH;
 if(!ing){
  if(ball.x<L+BR){ball.x=L+BR;ball.vx=Math.abs(ball.vx)*.8}
  if(ball.x>R-BR){ball.x=R-BR;ball.vx=-Math.abs(ball.vx)*.8}}
 else{
  if(ball.x<L-28+BR){ball.x=L-28+BR;ball.vx=Math.abs(ball.vx)*.2}
  if(ball.x>R+28-BR){ball.x=R+28-BR;ball.vx=-Math.abs(ball.vx)*.2}
  if(state==='play'&&ball.x<L-BR&&ball.z<36){score[1]++;state='goal';gt=1.8;ex=1}
  if(state==='play'&&ball.x>R+BR&&ball.z<36){score[0]++;state='goal';gt=1.8;ex=1}}}
/* ---- 3D look: perspective projection of the 2D pitch ---- */
function pj(x,y){const u=(y-T)/(B-T),s=(.5+.5*u)*2.2;return[450+(x-camX)*s,150+330*u,s]}
function minimap(){const x0=400,y0=452,w=100,h=56;g.fillStyle='rgba(20,30,20,.7)';g.fillRect(x0,y0,w,h);g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=1;g.strokeRect(x0+4,y0+4,w-8,h-8);
 for(const p of P){g.fillStyle=p.team?'#ff7a1a':'#7fb2ff';g.beginPath();g.arc(x0+4+(p.x-L)/(R-L)*(w-8),y0+4+(p.y-T)/(B-T)*(h-8),2.5,0,7);g.fill()}
 g.fillStyle='#fff';g.beginPath();g.arc(x0+4+(ball.x-L)/(R-L)*(w-8),y0+4+(ball.y-T)/(B-T)*(h-8),2,0,7);g.fill()}
function pt(x,y,z){const[a,b,s]=pj(x,y);return[a,b-z*s]}
function poly(pts,fill,stroke,lw){g.beginPath();pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||2;g.stroke()}}
function line(pts){g.beginPath();pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke()}
function text(s,x,y,size,col,al){g.font='800 '+size+'px '+FONT;g.textAlign=al||'center';g.fillStyle=col||'#fff';g.fillText(s,x,y)}
const CROWD=['#e63946','#f1faee','#ffd166','#4cc9f0','#ff9f1c','#9b5de5','#2ec4b6','#fff'];
function dot(x,y,r,i,t){
 x-=(camX-840)*.1;const c=CROWD[(i*7+(i>>3))%8],j=Math.sin(tm*.006+i*1.7)*(1+ex*4)*t,sk=SKIN[i%6],up=(ex>.05&&i%3)||i%7===0;
 if(i%11===0){g.strokeStyle='#ccc';g.lineWidth=1;g.beginPath();g.moveTo(x+r*1.2,y+j);g.lineTo(x+r*1.2,y+j-r*4.5);g.stroke();g.fillStyle=CROWD[(i+2)%8];g.fillRect(x+r*1.2,y+j-r*4.5,r*2.4+Math.sin(tm*.01+i)*r*.5,r*1.3)}
 if(up){g.strokeStyle=sk;g.lineCap='round';g.lineWidth=r*.5;const w=Math.sin(tm*.012+i)*r*.6;g.beginPath();g.moveTo(x-r*.9,y+j);g.lineTo(x-r*1.4+w,y+j-r*2);g.moveTo(x+r*.9,y+j);g.lineTo(x+r*1.4+w,y+j-r*2);g.stroke()}
 g.fillStyle=c;g.beginPath();g.roundRect(x-r*1.1,y+j-r*.2,r*2.2,r*2.4,r*.6);g.fill();
 if(i%4===0){g.fillStyle=CROWD[(i+3)%8];g.fillRect(x-r*.95,y+j,r*1.9,r*.5)}
 g.fillStyle=sk;g.beginPath();g.arc(x,y+j-r*.9,r*.75,0,7);g.fill();
 g.fillStyle=i%2?'#2a1a10':'#caa44a';g.beginPath();g.arc(x,y+j-r*1.05,r*.75,3.14,6.28);g.fill()}
function stands(){
 const gr=g.createLinearGradient(0,0,0,175);gr.addColorStop(0,'#05090f');gr.addColorStop(1,'#1a2634');g.fillStyle=gr;g.fillRect(0,0,900,175);
 for(let r=0;r<6;r++){const y=156-r*24;g.fillStyle=r%2?'#223044':'#1c2938';g.fillRect(0,y-6,900,24);
  for(let i=0;i<78;i++)dot(-70+i*13.4+(r&1)*6,y+6,4.6,i*3+r*11,1)}
 for(const sd of[0,1]){const m=x=>sd?900-x:x;
  poly([[m(0),160],[m(176),175],[m(26),486],[m(0),486]],'#1c2938');
  for(let k=0;k<14;k++){const t=k/13,ex0=176-150*t,y=175+311*t;for(let x=ex0-10,i=0;x>-6;x-=15+t*8,i++)dot(m(x),y-6,4+t*4,i+k*5,1+t)}}
}
function cam(x,y,k,col,d){g.save();g.translate(x,y);g.scale(d*k,k);
 g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,0,12,4,0,0,7);g.fill();
 g.strokeStyle='#222';g.lineWidth=2;g.beginPath();g.moveTo(-6,0);g.lineTo(0,-18);g.lineTo(6,0);g.moveTo(0,-18);g.lineTo(0,0);g.stroke();
 g.fillStyle=col;g.beginPath();g.roundRect(-18,-36,12,18,3);g.fill();
 g.fillStyle='#e0b38a';g.beginPath();g.arc(-12,-41,4.5,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(-12,-43,4.5,3.14,6.28);g.fill();
 g.fillStyle='#1a1a22';g.fillRect(-9,-30,22,11);g.fillStyle='#333';g.fillRect(13,-28,9,7);g.fillStyle='#8cf';g.fillRect(21,-27,2,5);g.restore()}
function crew(){
 for(const X of[L-100,R+100])poly([pt(X,T,0),pt(X,B,0),pt(X,B,14),pt(X,T,14)],'#16256b','rgba(255,255,255,.6)',1);
 for(const[x,y,col,d]of[[L-75,CY-120,'#e63946',1],[L-75,CY+120,'#4cc9f0',1],[R+75,CY-120,'#ffd166',-1],[R+75,CY+120,'#9b5de5',-1]]){const[a,b,s]=pj(x,y);cam(a,b,s*.45,col,d)}}
function board(x1,x2,y,h,n){const w=(x2-x1)/n;for(let i=0;i<n;i++){poly([pt(x1+i*w,y,0),pt(x1+(i+1)*w,y,0),pt(x1+(i+1)*w,y,h),pt(x1+i*w,y,h)],'#16256b');const q=pt(x1+(i+.5)*w,y,h/2);text('MINI CUP',q[0],q[1]+3,Math.max(6,5*pj(0,y)[2]),'#fff')}}
function pitch(){
 g.fillStyle='#17482a';g.fillRect(0,142,900,378);
